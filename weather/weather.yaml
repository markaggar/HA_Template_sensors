              {% endfor %}
            {% endif %}
          humidity: >-
            {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
            {% if forecast %}
              {% set tomorrow_date = (now().date() + timedelta(days=1)) %}
              {% for day in forecast %}
