# Weather Package
# Save as /homeassistant/packages/weather.yaml and in configuration.yaml, under homeassistant:, include the line - 
#  packages: !include_dir_named packages
# Replace all instances of weather.chezaggar with the name of your weather sensor

template:
  # Trigger-based sensors for forecast data
  - trigger:
      - platform: time_pattern
        minutes: "/30"
    action:
      - service: weather.get_forecasts
        data:
          type: daily
        target:
          entity_id: weather.chezaggar
        response_variable: daily
    sensor:
      - name: Weather Daily
        unique_id: weather_daily
        state: "{{ daily['weather.chezaggar'].forecast[0].condition }}"
        attributes:
          forecast: "{{ daily['weather.chezaggar'].forecast }}"

  - trigger:
      - platform: time_pattern
        minutes: "/30"
    action:
      - service: weather.get_forecasts
        data:
          type: hourly
        target:
          entity_id: weather.chezaggar
        response_variable: hourly
    sensor:
      - name: Weather Hourly
        unique_id: weather_hourly
        state: "{{ hourly['weather.chezaggar'].forecast[0].condition }}"
        attributes:
          forecast: "{{ hourly['weather.chezaggar'].forecast[:24] }}"

  # Template sensors
  - sensor:
      - name: "Weather Forecast Today"
        unique_id: weather_forecast_today
        state: >
          {% set today = now().date() %}
          {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
          {% if forecast %}
            {% for day in forecast %}
              {% set forecast_date = day.datetime | as_datetime | default(none) %}
              {% if forecast_date and forecast_date.date() == today %}
                {{ day.condition | default('unknown') }}
              {% endif %}
            {% endfor %}
          {% else %}
            unknown
          {% endif %}
        icon: >
          {% set today = now().date() %}
          {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
          {% if forecast %}
            {% for day in forecast %}
              {% set forecast_date = day.datetime | as_datetime | default(none) %}
              {% if forecast_date and forecast_date.date() == today %}
                {% set condition = day.condition | default('unknown') %}
                {% if condition == 'sunny' %}
                  mdi:weather-sunny
                {% elif condition == 'partlycloudy' %}
                  mdi:weather-partly-cloudy
                {% elif condition == 'cloudy' %}
                  mdi:weather-cloudy
                {% elif condition == 'rainy' %}
                  mdi:weather-rainy
                {% else %}
                  mdi:weather-cloudy
                {% endif %}
              {% endif %}
            {% endfor %}
          {% else %}
            mdi:weather-cloudy
          {% endif %}
        availability: >
          {{ state_attr('sensor.weather_daily', 'forecast') is not none }}
        attributes:
          datetime: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.datetime }}
                {% endif %}
              {% endfor %}
            {% endif %}
          condition: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.condition | default('unknown') }}
                {% endif %}
              {% endfor %}
            {% else %}
              unknown
            {% endif %}
          precipitation_probability: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.precipitation_probability | default(0) }}
                {% endif %}
              {% endfor %}
            {% else %}
              0
            {% endif %}
          cloud_coverage: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.cloud_coverage | default(0) }}
                {% endif %}
              {% endfor %}
            {% else %}
              0
            {% endif %}
          wind_bearing: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.wind_bearing | default(0) }}
                {% endif %}
              {% endfor %}
            {% else %}
              0
            {% endif %}
          temperature: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.temperature | default(0) }}
                {% endif %}
              {% endfor %}
            {% else %}
              0
            {% endif %}
          templow: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.templow | default(0) }}
                {% endif %}
              {% endfor %}
            {% else %}
              0
            {% endif %}
          wind_gust_speed: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.wind_gust_speed | default(0) }}
                {% endif %}
              {% endfor %}
            {% else %}
              0
            {% endif %}
          wind_speed: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.wind_speed | default(0) }}
                {% endif %}
              {% endfor %}
            {% else %}
              0
            {% endif %}
          precipitation: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.precipitation | default(0) }}
                {% endif %}
              {% endfor %}
            {% else %}
              0
            {% endif %}
          humidity: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.humidity | default(0) }}
                {% endif %}
              {% endfor %}
            {% else %}
              0
            {% endif %}
          last_updated: "{{ now().isoformat() }}"

      - name: "Weather Forecast Tomorrow"
        unique_id: weather_forecast_tomorrow
        state: >-
          {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
          {% if forecast %}
            {% set tomorrow_date = (now().date() + timedelta(days=1)) %}
            {% for day in forecast %}
              {% set forecast_date = day.datetime | as_datetime | default(none) %}
              {% if forecast_date and forecast_date.date() == tomorrow_date %}
                {{ day.condition | default('unknown') }}
              {% endif %}
            {% endfor %}
          {% else %}
            unavailable
          {% endif %}
        icon: >
          {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
          {% if forecast %}
            {% set tomorrow_date = (now().date() + timedelta(days=1)) %}
            {% for day in forecast %}
              {% set forecast_date = day.datetime | as_datetime | default(none) %}
              {% if forecast_date and forecast_date.date() == tomorrow_date %}
                {% set condition = day.condition | default('unknown') %}
                {% if condition == 'sunny' %}
