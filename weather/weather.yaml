            {% endif %}
          wind_bearing: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.chezaggar_weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.wind_bearing | default(0) }}
                {% endif %}
              {% endfor %}
            {% else %}
              0
            {% endif %}
          temperature: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.chezaggar_weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.temperature | default(0) }}
                {% endif %}
              {% endfor %}
            {% else %}
              0
            {% endif %}
          templow: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.chezaggar_weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.templow | default(0) }}
                {% endif %}
              {% endfor %}
            {% else %}
              0
            {% endif %}
          wind_gust_speed: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.chezaggar_weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.wind_gust_speed | default(0) }}
                {% endif %}
              {% endfor %}
            {% else %}
              0
            {% endif %}
          wind_speed: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.chezaggar_weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.wind_speed | default(0) }}
                {% endif %}
              {% endfor %}
            {% else %}
              0
            {% endif %}
          precipitation: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.chezaggar_weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.precipitation | default(0) }}
                {% endif %}
              {% endfor %}
            {% else %}
              0
            {% endif %}
          humidity: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.chezaggar_weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.humidity | default(0) }}
                {% endif %}
              {% endfor %}
            {% else %}
