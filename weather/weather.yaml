            {% endif %}
          wind_speed: >-
            {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
            {% if forecast %}
              {% set tomorrow_date = (now().date() + timedelta(days=1)) %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == tomorrow_date %}
                  {{ day.wind_speed | default(0) }}
                {% endif %}
              {% endfor %}
            {% endif %}
          wind_bearing: >-
            {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
            {% if forecast %}
              {% set tomorrow_date = (now().date() + timedelta(days=1)) %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == tomorrow_date %}
                  {{ day.wind_bearing | default(0) }}
                {% endif %}
              {% endfor %}
            {% endif %}
          wind_gust_speed: >-
            {% set forecast = state_attr('sensor.weather_daily', 'forecast') %}
            {% if forecast %}
              {% set tomorrow_date = (now().date() + timedelta(days=1)) %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == tomorrow_date %}
