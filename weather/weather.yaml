# ChezAggar Weather Package
# Contains all weather-related sensors for ChezAggar location

template:
  # Trigger-based sensors for forecast data
  - trigger:
      - platform: time_pattern
        minutes: "/30"
    action:
      - service: weather.get_forecasts
        data:
          type: daily
        target:
          entity_id: weather.chezaggar
        response_variable: daily
    sensor:
      - name: ChezAggar Weather Daily
        unique_id: chezaggar_weather_daily
        state: "{{ daily['weather.chezaggar'].forecast[0].condition }}"
        attributes:
          forecast: "{{ daily['weather.chezaggar'].forecast }}"

  - trigger:
      - platform: time_pattern
        minutes: "/30"
    action:
      - service: weather.get_forecasts
        data:
          type: hourly
        target:
          entity_id: weather.chezaggar
        response_variable: hourly
    sensor:
      - name: ChezAggar Weather Hourly
        unique_id: chezaggar_weather_hourly
        state: "{{ hourly['weather.chezaggar'].forecast[0].condition }}"
        attributes:
          forecast: "{{ hourly['weather.chezaggar'].forecast[:24] }}"

  # Template sensors
  - sensor:
      - name: "ChezAggar Weather Forecast Today"
        unique_id: chezaggar_weather_forecast_today
        state: >
          {% set today = now().date() %}
          {% set forecast = state_attr('sensor.chezaggar_weather_daily', 'forecast') %}
          {% if forecast %}
            {% for day in forecast %}
              {% set forecast_date = day.datetime | as_datetime | default(none) %}
              {% if forecast_date and forecast_date.date() == today %}
                {{ day.condition | default('unknown') }}
              {% endif %}
            {% endfor %}
          {% else %}
            unknown
          {% endif %}
        icon: >
          {% set today = now().date() %}
          {% set forecast = state_attr('sensor.chezaggar_weather_daily', 'forecast') %}
          {% if forecast %}
            {% for day in forecast %}
              {% set forecast_date = day.datetime | as_datetime | default(none) %}
              {% if forecast_date and forecast_date.date() == today %}
                {% set condition = day.condition | default('unknown') %}
                {% if condition == 'sunny' %}
                  mdi:weather-sunny
                {% elif condition == 'partlycloudy' %}
                  mdi:weather-partly-cloudy
                {% elif condition == 'cloudy' %}
                  mdi:weather-cloudy
                {% elif condition == 'rainy' %}
                  mdi:weather-rainy
                {% else %}
                  mdi:weather-cloudy
                {% endif %}
              {% endif %}
            {% endfor %}
          {% else %}
            mdi:weather-cloudy
          {% endif %}
        availability: >
          {{ state_attr('sensor.chezaggar_weather_daily', 'forecast') is not none }}
        attributes:
          datetime: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.chezaggar_weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.datetime }}
                {% endif %}
              {% endfor %}
            {% endif %}
          condition: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.chezaggar_weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.condition | default('unknown') }}
                {% endif %}
              {% endfor %}
            {% else %}
              unknown
            {% endif %}
          precipitation_probability: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.chezaggar_weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
                  {{ day.precipitation_probability | default(0) }}
                {% endif %}
              {% endfor %}
            {% else %}
              0
            {% endif %}
          cloud_coverage: >
            {% set today = now().date() %}
            {% set forecast = state_attr('sensor.chezaggar_weather_daily', 'forecast') %}
            {% if forecast %}
              {% for day in forecast %}
                {% set forecast_date = day.datetime | as_datetime | default(none) %}
                {% if forecast_date and forecast_date.date() == today %}
